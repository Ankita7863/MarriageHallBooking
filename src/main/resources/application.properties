spring.application.name=marriage-hall-booking
server.port=8080

# ---- H2 file database (relational, no MySQL needed). Data survives restarts. ----
spring.datasource.url=jdbc:h2:file:./data/hallbooking;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
# Keep column names exactly as in the schema (BookingID, CustomerName, ...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ---- H2 web console: http://localhost:8080/h2-console ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JSON ----
spring.jackson.serialization.write-dates-as-timestamps=false
